  <!-- Notes -->
  <g transform="translate(1615 160)">
    <path d="M80 80V8M80 8L65 31M80 8L95 31" stroke="#26333c" stroke-width="5" fill="none"/><text x="80" y="108" class="note-head" text-anchor="middle">北</text><text x="80" y="130" class="small" text-anchor="middle">屋后</text>
    <text x="0" y="188" class="note-head">功能配置</text>
    <rect x="0" y="210" width="18" height="18" fill="#e7f4ea" stroke="#a9b8ad"/><text x="30" y="224" class="note">主卧套房 1间</text>
    <rect x="0" y="242" width="18" height="18" fill="#fff0dc" stroke="#c8b69d"/><text x="30" y="256" class="note">次卧 3间</text>
    <rect x="0" y="274" width="18" height="18" fill="#e7f2f9" stroke="#a6bdcb"/><text x="30" y="288" class="note">家庭厅 / 过厅</text>
    <rect x="0" y="306" width="18" height="18" fill="#e5f2ec" stroke="#20a68f"/><text x="30" y="320" class="note">公卫 + 主卫｜无书房</text>
    <text x="0" y="382" class="note-head">排水组织</text>
    <text x="0" y="414" class="note">1. 公卫约2.30 × 1.60m，叠合 A07。</text><text x="0" y="446" class="note">2. 主卫约2.38 × 2.00m，叠合 A15。</text><text x="0" y="478" class="note">3. PS1、PS2均沿湿区墙角集中设置。</text><text x="0" y="510" class="note">4. 污废水立管上下直通，减少横支管。</text><text x="0" y="542" class="note">5. 楼梯与一层 A09 位置完全叠合。</text>
    <text x="0" y="606" class="note-head">覆盖计算</text><text x="0" y="638" class="note">家庭厅墙体较主体线内退0.80m。</text><text x="0" y="670" class="note">阳台净深：0.80m内退 + 0.80m外挑。</text><text x="0" y="702" class="note">屋面水平挑檐0.80m，檐口对齐栏杆。</text><text x="0" y="734" class="note">右侧突出体不可上人，不设置小露台。</text>
    <rect x="0" y="760" width="405" height="134" rx="5" fill="#fff7df" stroke="#e1c766"/><text x="18" y="792" class="note-head">施工前必须复核</text><text x="18" y="822" class="note">立管位置、降板范围、梁高和楼梯步数；</text><text x="18" y="850" class="note">同时复核结构、消防、采光及当地规范。</text><text x="18" y="878" class="note">本方案不能直接替代正式施工图。</text>
  </g>
  <text x="180" y="1230" class="subtitle">空间优化：家庭厅内退形成有顶凹廊；阳台外沿与0.80m檐口同线；右翼仍保留一层主卧外突、二层不设露台。</text>
  <text x="180" y="1262" class="small">覆盖为正投影计算；强风夹雨时外沿仍可能进水。檐沟、泛水、栏杆节点及悬挑结构须由建筑和结构专业复核。</text>
</svg>
