  </g>
  <text x="180" y="1220" class="subtitle">使用优化：全部床长轴东西向；客厅座位组向东移动且不越入户门；主卧B南墙内退0.50m；门廊累计东移0.70m；厨房与餐厅间采用整墙四扇推拉门。</text>
  <text x="180" y="1252" class="small">绿色虚线仅为二层排水对位参考，不新增墙体，也不改变一层房间结构。</text>
</svg>
