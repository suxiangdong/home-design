    <text x="0" y="222" class="note">1. 主卧B南墙较客厅内退约0.50m。</text><text x="0" y="254" class="note">2. 门廊再向东移0.50m，累计东移0.70m。</text><text x="0" y="286" class="note">3. 右侧一层主卧向南外突约1.00m。</text><text x="0" y="318" class="note">4. 二层不跟随外突，不形成小露台。</text>
