  <!-- Notes -->
  <g transform="translate(1615 160)">
    <path d="M80 80V8M80 8L65 31M80 8L95 31" stroke="#26333c" stroke-width="5" fill="none"/><text x="80" y="108" class="note-head" text-anchor="middle">北</text><text x="80" y="130" class="small" text-anchor="middle">屋后</text>
    <text x="0" y="188" class="note-head">本次处理范围</text>
    <text x="0" y="222" class="note">1. 北侧次卧、厨房、餐厅、书房缩短。</text><text x="0" y="254" class="note">2. 厨房与餐厅左移，书房置于东北角。</text><text x="0" y="286" class="note">3. 书房与右主卧套房间增加横向过道。</text><text x="0" y="318" class="note">4. 西侧主卧B扩至约4.00 × 4.00m。</text>
